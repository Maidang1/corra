name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Resolve modules (regenerate go.sum)
        run: go mod tidy
      - name: Generate the app icon
        run: go run ./internal/genicon
      - name: gofmt
        run: |
          out=$(gofmt -l . | grep -v third_party || true)
          if [ -n "$out" ]; then echo "unformatted: $out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: go build ./...
