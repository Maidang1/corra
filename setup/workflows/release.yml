name: Release

# Builds packaged apps for macOS, Windows and Linux when a version tag is
# pushed, and uploads them to a draft release (per MyGo's GitHub Actions
# guide). Publish the draft from the release page.
#
# Native UI app: no Bun, no frontend; the mygo CLI is pinned as a Go tool in
# go.mod and runs as `go tool mygo`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the draft release, and the uploads to it

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Resolve modules (regenerate go.sum)
        run: go mod tidy
      - name: Generate the app icon
        run: go run ./internal/genicon
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ matrix.name }}" = "macOS" ]; then export CGO_ENABLED=1; fi
          go tool mygo build -platform "${{ matrix.platform }}" -upload
